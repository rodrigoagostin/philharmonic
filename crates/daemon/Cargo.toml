[package]
name = "philharmonicd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
libc = "0.2"
philharmonic-core = { version = "0.1.0", path = "../core" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
